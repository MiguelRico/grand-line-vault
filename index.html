    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07111d" />
    <script>
      try {
        const settings = JSON.parse(localStorage.getItem('grand-line-vault:settings') || '{}');

    <meta name="description" content="Gestiona tu colección de One Piece Card Game." />
    <title>Grand Line Vault</title>
